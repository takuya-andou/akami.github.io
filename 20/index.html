<style>
  :root {
    --paper: #F6F3EC;
    --card: #FFFDF9;
    --ink: #1C1B18;
    --sub: #5A5854;
    --line: #E3DFD6;
    --shu: #C63D2A;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, system-ui, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 600px; margin: 0 auto; padding: 16px 16px 40px; }
  .nb { display: inline-block; }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
    margin-top: 12px;
  }
  .card:first-child { margin-top: 0; }
  .head { padding: 34px 20px 26px; overflow: hidden; }
  .head::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 10px;
    background: var(--shu);
  }
  .eyebrow { margin: 0; font-size: 14px; font-weight: 700; color: var(--sub); }
  h1 { margin: 4px 0 0; font-weight: 900; line-height: 1.1; }
  h1 .big { display: block; font-size: 84px; letter-spacing: .02em; color: var(--shu); }
  h1 .big span { display: inline-block; animation: pop .5s cubic-bezier(.2, .9, .3, 1.5) both; }
  h1 .big span:nth-child(2) { animation-delay: .08s; }
  h1 .small { display: block; margin-top: 10px; font-size: 26px; font-weight: 800; color: var(--ink); animation: rise .5s ease .25s both; }
  .lead { margin: 14px 0 0; font-size: 16px; animation: rise .5s ease .35s both; }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  @media (prefers-reduced-motion: reduce) {
    h1 .big span, h1 .small, .lead { animation: none; }
  }
  .static h1 .big span, .static h1 .small, .static .lead { animation: none; }

  .label { margin: 18px 0 0; font-size: 14px; font-weight: 700; color: var(--sub); }
  .act {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding: 14px 16px;
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.45;
  }
  .act:first-child { margin-top: 0; }
  .act span { flex: none; font-size: 13px; color: var(--shu); }
  .act.primary { background: var(--ink); color: #fff; }
  .act.primary span { color: #F3C9BF; }
  .act:focus-visible { outline: 2px solid var(--shu); outline-offset: 3px; }
  .note { margin: 12px 0 0; font-size: 12.5px; color: var(--sub); }
  .note a { color: inherit; }

<canvas id="confetti" aria-hidden="true"></canvas>
<main>

    <a class="act" href="https://x.com/t_andou" data-dm="事業20個チャレンジを見ました。AIで効率化してほしい仕事があります。&#10;・業種：&#10;・困っている作業：" target="_blank" rel="noopener">AIで仕事を効率化してほしい<span>DM →</span></a>

<script>
  // DMボタン: @t_andou 宛てのDM画面を用件の書き出し入りで開く（JSが動かない環境ではプロフィールへ）
  document.querySelectorAll('[data-dm]').forEach((a) => {
    a.href = 'https://x.com/messages/compose?recipient_id=128096079&text=' + encodeURIComponent(a.dataset.dm);
  });

  // 開いた瞬間に、左右の下からクラッカーの紙吹雪を一度だけ飛ばす
  (() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isStatic = document.documentElement.classList.contains('static');
    const canvas = document.getElementById('confetti');
    if (reduce || isStatic || !canvas.getContext) return;
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const fit = () => {
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    fit();
    addEventListener('resize', fit);
    const colors = ['#C63D2A', '#1C1B18', '#E2B33C', '#EBB6A9', '#FFFFFF'];
    const parts = [];
    const shoot = (x, y, dir) => {
      for (let i = 0; i < 80; i++) {
        const angle = -Math.PI / 2 + dir * (0.18 + Math.random() * 0.75);
        const speed = 11 + Math.random() * 10;
        parts.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          w: 6 + Math.random() * 6,
          h: 3 + Math.random() * 4,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.35,
          wob: Math.random() * Math.PI * 2,
          color: colors[i % colors.length]
        });
      }
    };
    shoot(0, innerHeight * 0.92, 1);
    shoot(innerWidth, innerHeight * 0.92, -1);
    const start = performance.now();
    const tick = (now) => {
      const t = now - start;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const fade = t > 2600 ? Math.max(0, 1 - (t - 2600) / 800) : 1;
      for (const p of parts) {
        p.vy += 0.32;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.wob += 0.15;
        p.x += p.vx + Math.sin(p.wob) * 0.6;
        p.y += p.vy;
        p.rot += p.vr;
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.cos(p.wob));
        ctx.fillStyle = p.color;
        ctx.strokeStyle = 'rgba(28,27,24,.15)';
        ctx.lineWidth = 0.5;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (t < 3400) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(tick);
  })();
</script>
